services:
  - type: web
    name: trust-issues
    runtime: docker
    plan: standard
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trust-issues-db
          property: connectionString
      - key: CONSOLE_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: VIRUSTOTAL_KEY
        sync: false
      - key: URLSCAN_KEY
        sync: false
      - key: URLHAUS_AUTH_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: trust-issues-db
    plan: free
    region: frankfurt
    databaseName: trust_issues
    user: trust_issues
