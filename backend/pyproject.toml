[project]
name = "trust-issues"
version = "1.0.0"
description = "Trust Issues | أزمة ثقة — early detection of fraudulent links and websites"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "httpx[http2]>=0.27",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "playwright>=1.48",
  "tldextract>=5.1",
  "dnspython>=2.7",
  "dnslib>=0.9.25",
  "dnstwist>=20240812",
  "python-whois>=0.9",
  "ipwhois>=1.3",
  "mmh3>=5.0",
  "imagehash>=4.3",
  "pillow>=11.0",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "numpy>=2.0",
  "pandas>=2.2",
  "joblib>=1.4",
  "networkx>=3.4",
  "reportlab>=4.2",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.6",
  "pywebpush>=2.0",
  "anthropic>=0.40",
  "openai>=1.55",
  "pyyaml>=6.0",
  "rapidfuzz>=3.10",
  "confusable-homoglyphs>=3.3",
  "websockets>=13.0",
  "python-multipart>=0.0.12",
  "cryptography>=43.0",
  "sse-starlette>=2.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
]

[project.scripts]
trust-issues = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
